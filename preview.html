<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatRange Preview</title>

    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111827;
        color: #f9fafb;
      }

      main {
        width: min(1200px, 100%);
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      #status {
        margin: 0;
        color: #cbd5e1;
      }

      #metadata {
        margin: 8px 0 0;
        color: #94a3b8;
        font-size: 14px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      #download {
        background: #2563eb;
      }

      #delete-capture {
        background: #b91c1c;
      }

      .capture-frame {
        overflow: auto;
        border: 1px solid #374151;
        border-radius: 12px;
        background: repeating-conic-gradient(#e5e7eb 0% 25%, #f9fafb 0% 50%) 50% / 20px 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      #capture {
        display: block;
        max-width: 100%;
        height: auto;
      }

      #capture[hidden] {
        display: none;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="toolbar">
        <div>
          <h1>ChatRange Capture Preview</h1>

          <p id="status">Loading the selected capture...</p>

          <p id="metadata" hidden></p>
        </div>

        <div class="actions">
          <button id="download" type="button" disabled>Download PNG</button>

          <button id="delete-capture" type="button" disabled>Delete capture</button>
        </div>
      </div>

      <div class="capture-frame">
        <img id="capture" alt="Cropped ChatRange conversation capture" hidden />
      </div>
    </main>

    <script type="module" src="/src/extension/preview.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ChatRange Preview</title>

    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #111827;
        color: #f9fafb;
      }

      main {
        width: min(1200px, 100%);
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      #status {
        margin: 0;
        color: #cbd5e1;
      }

      #metadata {
        margin: 8px 0 0;
        color: #94a3b8;
        font-size: 14px;
      }

      .toolbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .toolbar-copy {
        min-width: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 120ms ease,
          opacity 120ms ease,
          transform 120ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
        transform: none;
      }

      #download {
        background: #2563eb;
      }

      #download:hover:not(:disabled) {
        background: #1d4ed8;
      }

      #copy-capture {
        background: #047857;
      }

      #copy-capture:hover:not(:disabled) {
        background: #065f46;
      }

      #copy-capture.copy-success {
        background: #15803d;
      }

      #copy-capture.copy-error {
        background: #b45309;
      }

      #delete-capture {
        background: #b91c1c;
      }

      #delete-capture:hover:not(:disabled) {
        background: #991b1b;
      }

      .capture-frame {
        overflow: auto;
        border: 1px solid #374151;
        border-radius: 12px;
        background: repeating-conic-gradient(#e5e7eb 0% 25%, #f9fafb 0% 50%) 50% / 20px 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      #capture {
        display: block;
        max-width: 100%;
        height: auto;
      }

      #capture[hidden] {
        display: none;
      }

      @media (max-width: 760px) {
        main {
          padding: 16px;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .actions {
          justify-content: flex-start;
        }
      }

      @media (max-width: 460px) {
        .actions {
          display: grid;
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="toolbar">
        <div class="toolbar-copy">
          <h1>ChatRange Capture Preview</h1>

          <p id="status">Loading the selected capture...</p>

          <p id="metadata" hidden></p>
        </div>

        <div class="actions" aria-label="Capture actions">
          <button id="download" type="button" disabled>Download PNG</button>

          <button
            id="copy-capture"
            type="button"
            title="Copy the PNG image to the clipboard"
            disabled
          >
            Copy PNG
          </button>

          <button id="delete-capture" type="button" disabled>Delete capture</button>
        </div>
      </div>

      <div class="capture-frame">
        <img id="capture" alt="Cropped ChatRange conversation capture" hidden />
      </div>
    </main>

    <script type="module" src="/src/extension/preview.ts"></script>
  </body>
</html>
